# ==============================================================================
# AeroSpace Configuration
# ==============================================================================

start-at-login = true

# 起動時に JankyBorders を立ち上げて注目ウィンドウに枠線を表示
after-startup-command = [
  'exec-and-forget /bin/bash -c "PATH=/opt/homebrew/bin:/usr/local/bin:\$PATH borders active_color=0xff59c7fa inactive_color=0x00000000 width=4.0 hidpi=on"'
]

# フォーカス変更時にマウスカーソルをウィンドウ中央へ追従
on-focus-changed = ['move-mouse window-lazy-center']

# ワークスペース切り替え時のフック（ノッチHUD表示）
exec-on-workspace-change = [
  '/bin/bash', '-c',
  '$HOME/.config/aerospace/hud "$AEROSPACE_FOCUSED_WORKSPACE"'
]

# ------------------------------------------------------------------------------
# キーバインド設定
# ------------------------------------------------------------------------------
[mode.main.binding]

# ワークスペース切り替え (Option + キー)
alt-d = 'workspace Development'
alt-b = 'workspace Browser'
alt-n = 'workspace Note'
alt-c = 'workspace Chat'
alt-a = 'workspace AI'
alt-1 = 'workspace 1'

# ウィンドウをワークスペースへ移動 (Option + Shift + キー)
alt-shift-d = 'move-node-to-workspace Development'
alt-shift-b = 'move-node-to-workspace Browser'
alt-shift-n = 'move-node-to-workspace Note'
alt-shift-c = 'move-node-to-workspace Chat'
alt-shift-a = 'move-node-to-workspace AI'
alt-shift-1 = 'move-node-to-workspace 1'

# ウィンドウフォーカス移動 (Vimキーバインド)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# ウィンドウ位置入れ替え
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# フローティング切り替え・フルスクリーン・サイズ変更
alt-f = 'layout floating tiling'
alt-m = 'fullscreen'
alt-minus = 'resize smart -50'
alt-semicolon = 'resize smart +50'
alt-shift-minus = 'balance-sizes'

# ------------------------------------------------------------------------------
# アプリ自動振り分け (on-window-detected)
# ------------------------------------------------------------------------------

# --- Finder: オーバーレイ（フローティング）表示 ---
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# 設定等のダイアログもフローティング
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# --- 1. Development ---
[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92' # Cursor
run = 'move-node-to-workspace Development'

[[on-window-detected]]
if.app-id = 'com.google.antigravity'        # Antigravity
run = 'move-node-to-workspace Development'

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'         # WezTerm
run = 'move-node-to-workspace Development'

[[on-window-detected]]
if.app-id = 'com.linear'                     # Linear
run = 'move-node-to-workspace Development'

[[on-window-detected]]
if.app-id = 'com.stablyai.orca'              # Orca
run = 'move-node-to-workspace Development'

# --- 2. Browser ---
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'            # Zen Browser
run = 'move-node-to-workspace Browser'

[[on-window-detected]]
if.app-id = 'com.spotify.client'             # Spotify
run = 'move-node-to-workspace Browser'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'              # Google Chrome
run = 'move-node-to-workspace Browser'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'               # Safari
run = 'move-node-to-workspace Browser'

# --- 3. Note ---
[[on-window-detected]]
if.app-id = 'md.obsidian'                    # Obsidian
run = 'move-node-to-workspace Note'

[[on-window-detected]]
if.app-id = 'com.apple.Notes'                # Apple Notes (メモ)
run = 'move-node-to-workspace Note'

# --- 4. Chat ---
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'      # Slack
run = 'move-node-to-workspace Chat'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'                # Discord
run = 'move-node-to-workspace Chat'

[[on-window-detected]]
if.app-id = 'jp.naver.line.mac'              # LINE
run = 'move-node-to-workspace Chat'

# --- 5. AI (AI Chat) ---
[[on-window-detected]]
if.app-id = 'com.openai.codex'               # ChatGPT
run = 'move-node-to-workspace AI'

[[on-window-detected]]
if.app-id = 'com.meta.endo'                  # Muse
run = 'move-node-to-workspace AI'

[[on-window-detected]]
if.app-id = 'com.anysphere.sand'             # Grok Bot
run = 'move-node-to-workspace AI'

[[on-window-detected]]
if.app-id = 'com.google.GeminiMacOS'         # Gemini
run = 'move-node-to-workspace AI'

# --- 6. 未振り分け・その他アプリ -> ワークスペース '1' ---
[[on-window-detected]]
if.app-id = '.*'
run = 'move-node-to-workspace 1'
